name: daily-dispatch
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "One channel slug to run now (empty = today's plan)"
        default: ""
      job:
        description: "Select production format"
        type: choice
        default: "shorts_only"
        options:
          - shorts_only
          - long_only
          - long_and_shorts
      dry_run:
        description: "Skip uploads"
        default: "false"

permissions:
  contents: write
  issues: write

concurrency:
  group: fleet
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - id: plan
        run: python -m control.plan_day --only "${{ inputs.channel }}" >> "$GITHUB_OUTPUT"

  produce:
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    concurrency:
      group: channel-${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Install system dependencies & fonts
        run: sudo apt-get update && sudo apt-get install -y
